[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-space-occupancy"
version = "0.2.0"
description = "Multi-model people-counting for smart-building occupancy monitoring (detection, regression, gradient boosting, density estimation) with tracking, serving and edge benchmarking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rutuja More" }]
keywords = ["computer-vision", "crowd-counting", "occupancy", "yolo", "csrnet", "edge-ai"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.1",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tqdm>=4.66",
    "mlflow>=2.11",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "streamlit>=1.33"]
edge = ["onnx>=1.16", "onnxruntime>=1.17", "onnxscript>=0.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.3", "httpx>=0.27"]

[project.scripts]
smartspace = "smart_space.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
