services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs:ro
    environment:
      - SMARTSPACE_DEVICE=cpu
      - SMARTSPACE_NO_MLFLOW=1

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow
    profiles: ["tracking"]
